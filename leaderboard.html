<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Mr Bot — Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#5f4c57; --plum-deep:#3e323a; --amber:#f2a03d;
    --peach:#fdf3e7; --peach-strong:#f5c8a0;
    --muted:#9c8a92; --line:#e3d6c6; --red:#c0392b;
    --disp:'Jersey 15', ui-monospace, monospace;
    --body:'Plus Jakarta Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100dvh; overflow:hidden; margin:0;}
  body{font-family:var(--body); color:var(--plum-deep); background:var(--peach-strong);
       display:flex; flex-direction:column; align-items:center; user-select:none;}
  .app{width:100%; max-width:460px; height:100dvh; background:var(--peach);
       display:flex; flex-direction:column; box-shadow:0 0 0 1px rgba(95,76,87,.12);}
  /* topbar */
  .topbar{background:var(--plum); color:#fff; padding:9px 14px 11px; flex:0 0 auto;
          display:flex; align-items:center; gap:11px;}
  .pfp{width:42px; height:42px; border-radius:9px; background:#2a1420; flex:0 0 auto;
       image-rendering:pixelated; object-fit:cover; box-shadow:0 0 0 2px var(--amber);}
  .heads .eyebrow{font-family:var(--disp); font-size:12px; letter-spacing:.14em; color:var(--amber);}
  .heads .title{font-family:var(--disp); font-size:25px; line-height:1; margin:1px 0 0;}
  /* facts / status */
  .facts{background:#f6e2cb; color:#7a5a34; font-size:12.5px; padding:6px 14px; flex:0 0 auto;}
  .facts b{color:#5a3f1c;}
  /* table head */
  .thead{display:grid; grid-template-columns:38px 1fr 62px 66px; gap:6px; padding:7px 14px;
         background:#f3ede4; color:#6f6a63; font-size:11px; letter-spacing:.04em; flex:0 0 auto;
         text-transform:uppercase;}
  .thead .r{text-align:center;} .thead .n{text-align:right;} .thead .t{text-align:right;}
  /* rows */
  .list{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .row{display:grid; grid-template-columns:38px 1fr 62px 66px; gap:6px; align-items:center;
       padding:9px 14px; border-bottom:1px solid var(--line);}
  .row:nth-child(odd){background:#fbeede;}
  .rank{font-family:var(--disp); font-size:19px; text-align:center; color:var(--plum);}
  .row.top1 .rank{color:var(--amber);} .row.top2 .rank,.row.top3 .rank{color:#c98a3a;}
  .who{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .addr{font-family:ui-monospace,monospace; font-size:13px; color:var(--plum-deep); overflow:hidden; text-overflow:ellipsis;}
  .badge{font-family:var(--disp); font-size:10px; color:var(--plum-deep); background:var(--amber);
         border-radius:8px; padding:0 6px; align-self:flex-start;}
  .rounds{font-family:var(--disp); font-size:20px; text-align:right; color:var(--plum-deep);}
  .rounds small{font-size:11px; color:var(--muted); font-family:var(--body);}
  .time{font-family:ui-monospace,monospace; font-size:13px; text-align:right; color:#6f6a63;}
  .msg{padding:26px 20px; text-align:center; color:var(--muted); font-size:14px;}
  .msg b{color:var(--plum-deep);}
  /* footer */
  .footer{flex:0 0 auto; background:#f6ecdd; text-align:center; padding:7px 10px 9px;}
  .footer .tag{font-family:var(--disp); font-size:13px; color:#7a5a34;}
  .footer .links{font-size:12px; margin-top:2px;}
  .footer a{color:var(--muted); text-decoration:none; margin:0 6px;}
  .footer a:hover{color:var(--plum);}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <img class="pfp" id="pfp" alt="Cam, Bot #106" />
    <div class="heads">
      <div class="eyebrow">FINNBOTS · WORKSHOP</div>
      <h1 class="title">Mr Bot — Leaderboard</h1>
    </div>
  </header>

  <div class="facts">A <b>fun ranking</b> — not verified. Most rounds cleared, fastest time wins ties. Bot holders: rounds <b>×1.5</b>.</div>

  <div class="thead">
    <div class="r">#</div>
    <div>Player</div>
    <div class="n">Rounds</div>
    <div class="t">Time</div>
  </div>

  <div class="list" id="list">
    <div class="msg" id="msg">Loading the leaderboard…</div>
  </div>

  <footer class="footer">
    <div class="tag">a FinnBots game</div>
    <div class="links">
      <a href="https://mrbot.finnstergram.com/" target="_blank" rel="noopener">Play Mr Bot</a>·
      <a href="https://magiceden.io/marketplace/finnbot" target="_blank" rel="noopener">Buy a Bot</a>·
      <a href="https://games.finnstergram.com/" target="_blank" rel="noopener">More games</a>
    </div>
  </footer>
</div>

<script>
(function(){
  "use strict";
  // Cam = Bot #106 (brand PFP)
  var pfp = document.getElementById("pfp");
  pfp.src = "https://arweave.net/_cPSCheRvzVBlZK7QwM-3nXtteMdBbUn-zJhbGRlMmo/106.png";
  pfp.onerror = function(){ pfp.style.visibility = "hidden"; };

  var list = document.getElementById("list");

  function shortAddr(a){ return a ? a.slice(0,4) + "\u2026" + a.slice(-4) : "?"; }
  function fmtTime(ms){ var s = Math.round((parseInt(ms,10)||0)/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }

  // Minimal CSV parse — the scanner writes plain comma-separated rows with no
  // embedded commas (wallets, sigs and numbers only), so a straight split is safe.
  function parseCSV(text){
    var lines = text.trim().split(/\r?\n/);
    if(lines.length < 2) return [];
    var head = lines[0].split(",");
    var out = [];
    for(var i=1;i<lines.length;i++){
      if(!lines[i]) continue;
      var cells = lines[i].split(",");
      var row = {};
      for(var c=0;c<head.length;c++){ row[head[c]] = cells[c]; }
      out.push(row);
    }
    return out;
  }

  function showMessage(html){ list.innerHTML = '<div class="msg">' + html + '</div>'; }

  function render(rows){
    if(!rows.length){ showMessage("No scores posted yet.<br/><b>Be the first</b> — 25 OIL a go."); return; }
    var html = "";
    for(var i=0;i<rows.length;i++){
      var r = rows[i];
      var rank = r.rank || String(i+1);
      var holder = (r.bot_holder === "yes");
      var adj = r.rounds_adjusted, raw = r.rounds_raw;
      var showRaw = (holder && adj !== raw);
      var topcls = rank==="1" ? "top1" : (rank==="2" ? "top2" : (rank==="3" ? "top3" : ""));
      html += '<div class="row ' + topcls + '">'
        +   '<div class="rank">' + rank + '</div>'
        +   '<div class="who"><span class="addr">' + shortAddr(r.wallet) + '</span>'
        +       (holder ? '<span class="badge">BOT ×1.5</span>' : '')
        +   '</div>'
        +   '<div class="rounds">' + (adj || "0") + (showRaw ? ' <small>(' + raw + ')</small>' : '') + '</div>'
        +   '<div class="time">' + fmtTime(r.time_ms) + '</div>'
        + '</div>';
    }
    list.innerHTML = html;
  }

  // Cache-bust so a freshly published CSV shows without a hard refresh.
  fetch("./leaderboard_mrbot.csv?t=" + Date.now(), { cache:"no-store" })
    .then(function(res){ if(!res.ok) throw new Error("http " + res.status); return res.text(); })
    .then(function(text){ render(parseCSV(text)); })
    .catch(function(){ showMessage("The leaderboard isn\u2019t published yet.<br/>Check back after the next scan."); });
})();
</script>
</body>
</html>
